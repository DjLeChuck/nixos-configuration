keys:
  # Age key of the master one
  - &master_key age1q7w27xhmetzu95svd92q7vmj29yhk5pcf8aeslxnduvfxsk7y3kqt4l2dd

  # Age key of home
  - &host_home age1rg4cgg9y2t04g00pvukafuvgm5ae90ugfjxa4yehxdq3rzgheqks46kk4r

  # Age key of work
  - &host_work age1v2xze2qjp0auq62mr9r6a5h22ztfllclg0f0qpk7ngmzy9vuc5rq3cxejq

creation_rules:
  # Secrets shared across multiple machines
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work

  # OpenVPN3 work VPN configs (raw .ovpn files, sops binary format)
  - path_regex: secrets/vpn-work/.*\.ovpn$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work

  # WireGuard home VPN config (raw .conf file, sops binary format)
  - path_regex: secrets/vpn-home/.*\.conf$
    key_groups:
      - age:
          - *master_key
          - *host_work

  # Private GitLab tools
  - path_regex: secrets/private-tools\.yaml$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work

  # Private SSH config.d repository
  - path_regex: secrets/ssh-config-private\.yaml$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work

  # Ansible vault passwords, shared across all machines
  - path_regex: secrets/ansible-vault-passwords\.yaml$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work

  # Composer auth tokens (GitLab + GitHub)
  - path_regex: secrets/composer-auth\.yaml$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work

  # User login password hashes
  - path_regex: secrets/user-passwords\.yaml$
    key_groups:
      - age:
          - *master_key
          - *host_home
          - *host_work
